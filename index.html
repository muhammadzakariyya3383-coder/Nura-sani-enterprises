<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0f766e">
<title>Nura Sani Enterprises — V20.0</title>

<style>
:root{
  --primary:#0f766e;
  --primary-dark:#115e59;
  --secondary:#14b8a6;
  --bg:#f4f7f7;
  --card:#fff;
  --text:#17202a;
  --muted:#6b7280;
  --border:#e5e7eb;
  --danger:#dc2626;
  --warning:#d97706;
  --success:#16a34a;
  --shadow:0 8px 25px rgba(15,118,110,.08);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top left,rgba(20,184,166,.2),transparent 35%),
    linear-gradient(135deg,#f0fdfa,#ecfeff);
}
.login-box{
  width:100%;
  max-width:430px;
  background:white;
  padding:35px;
  border-radius:24px;
  box-shadow:0 25px 70px rgba(0,0,0,.12);
}
.logo{
  width:65px;height:65px;border-radius:18px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:white;display:flex;align-items:center;justify-content:center;
  font-size:25px;font-weight:900;margin-bottom:18px;
}
.login-box h1{margin:0 0 5px}
.login-box p{color:var(--muted);margin-bottom:25px}

.app{display:none;min-height:100vh}
.app.active{display:flex}

.sidebar{
  width:270px;
  background:#102a2a;
  color:white;
  min-height:100vh;
  position:fixed;
  left:0;top:0;bottom:0;
  overflow-y:auto;
  z-index:1000;
}
.brand{
  padding:22px 20px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.brand strong{display:block;font-size:17px}
.brand small{color:#9cc7c3}
.nav{padding:14px}
.nav-section{
  font-size:10px;
  color:#82aaa6;
  text-transform:uppercase;
  letter-spacing:1px;
  margin:18px 10px 7px;
}
.nav button{
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  color:#d9eeee;
  padding:11px 12px;
  border-radius:9px;
  margin-bottom:3px;
}
.nav button:hover,.nav button.active{
  background:rgba(20,184,166,.18);
  color:white;
}
.sidebar-footer{
  padding:15px;
  border-top:1px solid rgba(255,255,255,.08);
  margin-top:10px;
}
.logout{
  width:100%;
  border:0;
  background:#7f1d1d;
  color:white;
  padding:11px;
  border-radius:9px;
}

.main{
  margin-left:270px;
  width:calc(100% - 270px);
  min-height:100vh;
}
.topbar{
  height:72px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:500;
}
.topbar-left{display:flex;align-items:center;gap:12px}
.menu-mobile{display:none}
.page-title{font-size:19px;font-weight:800}
.user-pill{
  display:flex;align-items:center;gap:9px;
  color:var(--muted);font-size:13px;
}
.avatar{
  width:36px;height:36px;border-radius:50%;
  background:#ccfbf1;color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-weight:800;
}

.content{padding:25px;max-width:1800px;margin:auto}

.grid{
  display:grid;
  gap:18px;
}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:19px;
  box-shadow:var(--shadow);
}
.card h3{margin:0 0 15px;font-size:15px}
.stat-label{font-size:12px;color:var(--muted)}
.stat-value{font-size:25px;font-weight:850;margin-top:7px}
.stat-icon{
  float:right;width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  background:#ccfbf1;color:var(--primary);font-weight:900;
}

.section-head{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;margin:5px 0 18px;
}
.section-head h2{margin:0;font-size:21px}

.btn{
  border:0;border-radius:9px;padding:10px 14px;
  background:var(--primary);color:white;font-weight:700;
}
.btn:hover{background:var(--primary-dark)}
.btn.secondary{background:#e6fffb;color:var(--primary)}
.btn.dark{background:#1f2937}
.btn.danger{background:var(--danger)}
.btn.warning{background:var(--warning)}
.btn.success{background:var(--success)}
.btn.small{padding:7px 10px;font-size:12px}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}
.field label{
  display:block;font-size:12px;font-weight:700;
  color:#475569;margin-bottom:6px;
}
.field input,.field select,.field textarea{
  width:100%;padding:11px 12px;
  border:1px solid #d8dee4;border-radius:9px;
  outline:none;background:white;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--secondary);
  box-shadow:0 0 0 3px rgba(20,184,166,.12);
}
.field textarea{min-height:90px;resize:vertical}
.full{grid-column:1/-1}

.form-actions{
  margin-top:16px;display:flex;gap:8px;justify-content:flex-end;
}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{
  text-align:left;padding:12px 10px;
  border-bottom:1px solid var(--border);
  font-size:13px;
}
th{font-size:11px;text-transform:uppercase;color:var(--muted)}
tr:hover td{background:#f8fafb}

.badge{
  display:inline-block;padding:5px 8px;border-radius:999px;
  font-size:10px;font-weight:800;
}
.badge.green{background:#dcfce7;color:#166534}
.badge.orange{background:#ffedd5;color:#9a3412}
.badge.red{background:#fee2e2;color:#991b1b}
.badge.blue{background:#dbeafe;color:#1e40af}
.badge.gray{background:#f1f5f9;color:#475569}

.progress{
  height:9px;background:#e5e7eb;border-radius:20px;overflow:hidden;
}
.progress span{
  display:block;height:100%;background:var(--secondary);
}

.timeline{border-left:2px solid #d1fae5;padding-left:20px}
.timeline-item{position:relative;margin-bottom:18px}
.timeline-item:before{
  content:"";position:absolute;left:-27px;top:3px;
  width:10px;height:10px;border-radius:50%;
  background:var(--secondary);
}
.timeline-item small{color:var(--muted)}

.empty{
  padding:35px;text-align:center;color:var(--muted);
}
.kpi-note{font-size:11px;color:var(--muted);margin-top:5px}

.search-row{
  display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px;
}
.search-row input,.search-row select{
  padding:10px;border:1px solid var(--border);
  border-radius:9px;background:white;
}

.toast{
  position:fixed;right:20px;bottom:20px;
  background:#102a2a;color:white;
  padding:13px 18px;border-radius:10px;
  box-shadow:0 15px 40px rgba(0,0,0,.2);
  z-index:5000;display:none;
}
.toast.show{display:block}

.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  display:none;align-items:center;justify-content:center;
  z-index:3000;padding:20px;
}
.modal.show{display:flex}
.modal-box{
  background:white;width:100%;max-width:760px;
  max-height:90vh;overflow:auto;border-radius:18px;padding:22px;
}
.modal-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:18px;
}
.close{
  border:0;background:#f1f5f9;width:35px;height:35px;
  border-radius:50%;
}

.workflow{
  display:grid;grid-template-columns:repeat(6,1fr);
  gap:8px;
}
.workflow-item{
  padding:13px 8px;text-align:center;
  background:#f8fafc;border-radius:9px;font-size:11px;
}
.workflow-item.done{background:#ccfbf1;color:#115e59}
.workflow-item.active{background:#dbeafe;color:#1e40af}

@media(max-width:1100px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .grid-4{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:800px){
  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }
  .sidebar.open{transform:translateX(0)}
  .main{
    margin-left:0;width:100%;
  }
  .menu-mobile{
    display:block;border:0;background:#f1f5f9;
    width:40px;height:40px;border-radius:9px;
  }
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .workflow{grid-template-columns:repeat(3,1fr)}
  .content{padding:16px}
  .topbar{padding:0 15px}
}
@media(max-width:480px){
  .stats{grid-template-columns:1fr}
  .workflow{grid-template-columns:repeat(2,1fr)}
  .login-box{padding:25px}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="logo">NS</div>
    <h1>Nura Sani Enterprises</h1>
    <p>V20.0 Business Management Platform</p>

    <form id="loginForm">
      <div class="field">
        <label>Username</label>
        <input id="loginUser" value="admin" autocomplete="username">
      </div>

      <div class="field" style="margin-top:13px">
        <label>Password</label>
        <input id="loginPass" type="password" value="admin123" autocomplete="current-password">
      </div>

      <button class="btn" style="width:100%;margin-top:18px">
        Sign In
      </button>
    </form>

    <div style="margin-top:18px;font-size:11px;color:#64748b">
      Demo account: admin / admin123
    </div>
  </div>
</div>

<!-- APPLICATION -->
<div id="app" class="app">

  <aside id="sidebar" class="sidebar">

    <div class="brand">
      <strong>NURA SANI ENTERPRISES</strong>
      <small>V20.0 Business Platform</small>
    </div>

    <div class="nav">

      <div class="nav-section">Overview</div>
      <button data-page="dashboard">Dashboard</button>

      <div class="nav-section">Customers & Sales</div>
      <button data-page="customers">Customers</button>
      <button data-page="schools">Schools & Groups</button>
      <button data-page="orders">Orders</button>
      <button data-page="students">Students</button>
      <button data-page="products">Products</button>

      <div class="nav-section">Production</div>
      <button data-page="designs">Designs</button>
      <button data-page="production">Production</button>
      <button data-page="quality">Quality Control</button>
      <button data-page="inventory">Inventory</button>
      <button data-page="deliveries">Deliveries</button>

      <div class="nav-section">Finance</div>
      <button data-page="payments">Payments</button>
      <button data-page="expenses">Expenses</button>
      <button data-page="reports">Reports & Analytics</button>

      <div class="nav-section">Administration</div>
      <button data-page="staff">Staff</button>
      <button data-page="tasks">Tasks</button>
      <button data-page="audit">Audit History</button>
      <button data-page="settings">Settings</button>

      <div class="nav-section">Platform</div>
      <button data-page="architecture">V20 Architecture</button>

    </div>

    <div class="sidebar-footer">
      <button class="logout" onclick="logout()">Sign Out</button>
    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-mobile" onclick="toggleSidebar()">☰</button>
        <div id="pageTitle" class="page-title">Dashboard</div>
      </div>

      <div class="user-pill">
        <span>Administrator</span>
        <div class="avatar">A</div>
      </div>
    </header>

    <section id="content" class="content"></section>

  </main>
</div>

<div id="toast" class="toast"></div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">Form</h3>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
"use strict";

/* =========================================================
   NURA SANI ENTERPRISES V20.0
   FOUNDATION PROTOTYPE
   ========================================================= */

const DB_KEY = "NURA_SANI_ENTERPRISES_V20_DATABASE";

const defaultDB = {
  version:"20.0.1",
  business:{
    name:"Nura Sani Enterprises",
    phone:"",
    email:"",
    address:"",
    currency:"₦"
  },

  customers:[],
  schools:[],
  products:[
    {id:"P001",name:"Jersey",category:"Apparel",cost:5000,price:8500,stock:0,minStock:20},
    {id:"P002",name:"T-Shirt",category:"Apparel",cost:3000,price:5500,stock:0,minStock:20},
    {id:"P003",name:"Polo",category:"Apparel",cost:4500,price:7500,stock:0,minStock:20},
    {id:"P004",name:"Hoodie",category:"Apparel",cost:7000,price:12000,stock:0,minStock:10},
    {id:"P005",name:"Custom Print",category:"Printing",cost:1000,price:2500,stock:0,minStock:20}
  ],

  orders:[],
  students:[],
  designs:[],
  production:[],
  quality:[],
  inventory:[],
  payments:[],
  expenses:[],
  deliveries:[],
  staff:[
    {
      id:"ST001",
      name:"Administrator",
      role:"Admin",
      phone:"",
      status:"Active"
    }
  ],
  tasks:[],
  audit:[],
  settings:{
    numberingPrefix:"NSE",
    tax:0,
    lowStockAlert:true
  }
};

let db = loadDB();
let currentPage = "dashboard";

function clone(obj){
  return JSON.parse(JSON.stringify(obj));
}

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw){
      localStorage.setItem(DB_KEY,JSON.stringify(defaultDB));
      return clone(defaultDB);
    }
    return JSON.parse(raw);
  }catch(e){
    console.error(e);
    return clone(defaultDB);
  }
}

function saveDB(){
  localStorage.setItem(DB_KEY,JSON.stringify(db));
}

function uid(prefix){
  return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}

function money(value){
  return (db.business.currency || "₦") +
    Number(value || 0).toLocaleString("en-NG",{minimumFractionDigits:2});
}

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),2500);
}

function audit(action,details=""){
  db.audit.unshift({
    id:uid("AUD"),
    date:new Date().toISOString(),
    user:"admin",
    action,
    details
  });
  db.audit=db.audit.slice(0,1000);
  saveDB();
}

function today(){
  return new Date().toISOString().slice(0,10);
}

function nextOrderNumber(){
  const year=new Date().getFullYear();
  const count=db.orders.length+1;
  return `${db.settings.numberingPrefix}-${year}-${String(count).padStart(5,"0")}`;
}

/* =========================================================
   LOGIN
   ========================================================= */

document.getElementById("loginForm").addEventListener("submit",function(e){
  e.preventDefault();

  const user=document.getElementById("loginUser").value.trim();
  const pass=document.getElementById("loginPass").value;

  if(user==="admin" && pass==="admin123"){
    document.getElementById("loginScreen").style.display="none";
    document.getElementById("app").classList.add("active");
    audit("LOGIN","Administrator signed in");
    navigate("dashboard");
  }else{
    toast("Invalid login credentials");
  }
});

function logout(){
  audit("LOGOUT","Administrator signed out");
  document.getElementById("app").classList.remove("active");
  document.getElementById("loginScreen").style.display="flex";
}

/* =========================================================
   NAVIGATION
   ========================================================= */

const pageNames={
  dashboard:"Dashboard",
  customers:"Customers",
  schools:"Schools & Groups",
  orders:"Orders",
  students:"Students",
  products:"Products",
  designs:"Designs",
  production:"Production",
  quality:"Quality Control",
  inventory:"Inventory",
  deliveries:"Deliveries",
  payments:"Payments",
  expenses:"Expenses",
  reports:"Reports & Analytics",
  staff:"Staff",
  tasks:"Tasks",
  audit:"Audit History",
  settings:"Settings",
  architecture:"V20 Architecture"
};

document.querySelectorAll(".nav button[data-page]").forEach(btn=>{
  btn.addEventListener("click",()=>navigate(btn.dataset.page));
});

function navigate(page){
  currentPage=page;

  document.querySelectorAll(".nav button").forEach(b=>{
    b.classList.toggle("active",b.dataset.page===page);
  });

  document.getElementById("pageTitle").textContent=pageNames[page] || page;

  const fn=pages[page];
  if(fn) fn();

  document.getElementById("sidebar").classList.remove("open");
  window.scrollTo({top:0,behavior:"smooth"});
}

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
}

/* =========================================================
   DASHBOARD
   ========================================================= */

function dashboardStats(){
  const revenue=db.payments.reduce((s,p)=>s+Number(p.amount||0),0);
  const expenses=db.expenses.reduce((s,e)=>s+Number(e.amount||0),0);

  const outstanding=db.orders.reduce((s,o)=>{
    return s + Math.max(0,Number(o.total||0)-Number(o.paid||0));
  },0);

  return {revenue,expenses,outstanding,profit:revenue-expenses};
}

function pagesDashboard(){
  const s=dashboardStats();

  const orders=db.orders.length;
  const active=db.orders.filter(o=>!["Delivered","Cancelled"].includes(o.status)).length;
  const ready=db.orders.filter(o=>o.status==="Ready").length;

  document.getElementById("content").innerHTML=`
    <div class="section-head">
      <div>
        <h2>Business Overview</h2>
        <div class="kpi-note">Nura Sani Enterprises • V20.0 Foundation</div>
      </div>
      <button class="btn" onclick="openOrderForm()">+ New Order</button>
    </div>

    <div class="stats">
      ${stat("Orders",orders,"ORD")}
      ${stat("Revenue",money(s.revenue),"₦")}
      ${stat("Outstanding",money(s.outstanding),"BAL")}
      ${stat("Expenses",money(s.expenses),"EXP")}
      ${stat("Profit",money(s.profit),"P")}
    </div>

    <div style="height:18px"></div>

    <div class="grid grid-3">

      <div class="card">
        <h3>Order Pipeline</h3>
        ${pipeline("Pending")}
        ${pipeline("Designing")}
        ${pipeline("Printing")}
        ${pipeline("Production")}
        ${pipeline("QC")}
        ${pipeline("Ready")}
        ${pipeline("Delivered")}
      </div>

      <div class="card">
        <h3>Production Overview</h3>
        <div style="font-size:13px;margin-bottom:10px">
          Active production
          <strong style="float:right">${db.production.length}</strong>
        </div>
        <div style="font-size:13px;margin-bottom:10px">
          Ready orders
          <strong style="float:right">${ready}</strong>
        </div>
        <div style="font-size:13px;margin-bottom:10px">
          Active orders
          <strong style="float:right">${active}</strong>
        </div>
        <div style="margin-top:20px">
          <div class="stat-label">Production progress</div>
          <div class="progress" style="margin-top:8px">
            <span style="width:${productionProgress()}%"></span>
          </div>
          <div class="kpi-note">${productionProgress()}% estimated completion</div>
        </div>
      </div>

      <div class="card">
        <h3>Business Alerts</h3>
        ${alertsHTML()}
      </div>

    </div>

    <div style="height:18px"></div>

    <div class="grid grid-2">

      <div class="card">
        <div class="section-head">
          <h3>Recent Orders</h3>
          <button class="btn secondary small" onclick="navigate('orders')">View All</button>
        </div>

        ${recentOrdersHTML()}
      </div>

      <div class="card">
        <div class="section-head">
          <h3>Recent Activity</h3>
          <button class="btn secondary small" onclick="navigate('audit')">Audit</button>
        </div>

        ${recentAuditHTML()}
      </div>

    </div>
  `;
}

function stat(label,value,icon){
  return `
    <div class="card">
      <div class="stat-icon">${icon}</div>
      <div class="stat-label">${label}</div>
      <div class="stat-value">${value}</div>
    </div>
  `;
}

function pipeline(status){
  const count=db.orders.filter(o=>o.status===status).length;
  return `
    <div style="display:flex;justify-content:space-between;
      padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:12px">
      <span>${status}</span><strong>${count}</strong>
    </div>
  `;
}

function productionProgress(){
  if(!db.production.length)return 0;
  const total=db.production.reduce((s,p)=>s+Number(p.quantity||0),0);
  const done=db.production.reduce((s,p)=>s+Number(p.completed||0),0);
  if(!total)return 0;
  return Math.min(100,Math.round(done/total*100));
}

function alertsHTML(){
  const low=db.products.filter(p=>Number(p.stock||0)<=Number(p.minStock||0));

  if(!low.length){
    return `<div class="empty">No critical alerts.</div>`;
  }

  return low.slice(0,5).map(p=>`
    <div style="padding:9px 0;border-bottom:1px solid #f1f5f9">
      <span class="badge orange">LOW STOCK</span>
      <div style="font-size:13px;margin-top:5px">${esc(p.name)}</div>

function updateOrderPrice(){
  const select=document.getElementById("orderProduct");
  const opt=select?.options[select.selectedIndex];
  if(opt){
    document.getElementById("orderPrice").value=opt.dataset.price||0;
    updateOrderTotal();
  }
}

function updateOrderTotal(){
  const qty=Number(document.getElementById("orderQty")?.value||0);
  const price=Number(document.getElementById("orderPrice")?.value||0);
  const discount=Number(document.getElementById("orderDiscount")?.value||0);
  const total=Math.max(0,qty*price-discount);
  const el=document.getElementById("orderTotalPreview");
  if(el)el.value=money(total);
}

function saveOrder(e){
  e.preventDefault();
  const f=new FormData(e.target);

  const customer=db.customers.find(c=>c.id===f.get("customerId"));
  const product=db.products.find(p=>p.id===f.get("productId"));

  if(!customer||!product){
    toast("Select customer and product");
    return;
  }

  const qty=Number(f.get("quantity"));
  const price=Number(f.get("unitPrice"));
  const discount=Number(f.get("discount")||0);
  const total=Math.max(0,qty*price-discount);
  const deposit=Number(f.get("deposit")||0);

  const order={
    id:uid("ORD"),
    number:nextOrderNumber(),
    customerId:customer.id,
    customer:customer.name,
    productId:product.id,
    product:product.name,
    quantity:qty,
    unitPrice:price,
    discount,
    total,
    paid:Math.min(deposit,total),
    deadline:f.get("deadline"),
    priority:f.get("priority"),
    notes:f.get("notes"),
    status:"Pending",
    createdAt:new Date().toISOString()
  };

  db.orders.unshift(order);

  if(deposit>0){
    db.payments.unshift({
      id:uid("PAY"),
      orderId:order.id,
      orderNumber:order.number,
      customerId:customer.id,
      customer:customer.name,
      amount:Math.min(deposit,total),
      method:"Cash",
      reference:"",
      date:today(),
      note:"Initial deposit"
    });
  }

  audit("ORDER_CREATED",order.number);
  saveDB();
  closeModal();

  if(currentPage==="orders")renderOrders();
  toast(`Order ${order.number} created`);
}

function viewOrder(id){
  const o=db.orders.find(x=>x.id===id);
  if(!o)return;

  const balance=Math.max(0,o.total-o.paid);
  const students=db.students.filter(s=>s.orderId===id);
  const production=db.production.find(p=>p.orderId===id);

  showModal(`Order ${o.number}`,`
    <div class="grid grid-2">

      <div class="card">
        <h3>Order Information</h3>
        <p><strong>Customer:</strong> ${esc(o.customer)}</p>
        <p><strong>Product:</strong> ${esc(o.product)}</p>
        <p><strong>Quantity:</strong> ${o.quantity}</p>
        <p><strong>Deadline:</strong> ${esc(o.deadline||"Not set")}</p>
        <p><strong>Priority:</strong> ${esc(o.priority)}</p>
        <p><strong>Status:</strong> ${statusBadge(o.status)}</p>
      </div>

      <div class="card">
        <h3>Financial</h3>
        <p>Total: <strong>${money(o.total)}</strong></p>
        <p>Paid: <strong>${money(o.paid)}</strong></p>
        <p>Balance: <strong>${money(balance)}</strong></p>
        <button class="btn small" onclick="openPaymentForm('${o.id}')">Record Payment</button>
      </div>

    </div>

    <div style="height:15px"></div>

    <div class="card">
      <h3>Workflow</h3>
      <div class="workflow">
        ${["Pending","Designing","Printing","Production","QC","Ready"].map(s=>`
          <div class="workflow-item ${s===o.status?"active":""}">
            ${s}
          </div>
        `).join("")}
      </div>

      <div style="margin-top:15px;display:flex;gap:8px;flex-wrap:wrap">
        ${["Pending","Designing","Printing","Production","QC","Ready","Delivered"].map(s=>`
          <button class="btn small ${s===o.status?"success":"secondary"}"
            onclick="setOrderStatus('${o.id}','${s}')">${s}</button>
        `).join("")}
      </div>
    </div>

    <div style="height:15px"></div>

    <div class="card">
      <h3>Students / Jersey Names</h3>
      <p>${students.length} student records linked to this order.</p>
      <button class="btn small" onclick="closeModal();openStudentForm('${o.id}')">+ Add Student</button>
    </div>

    <div style="height:15px"></div>

    <div class="card">
      <h3>Production</h3>
      ${
        production ?
        `<p>Completed: ${production.completed} / ${production.quantity}</p>
         <div class="progress"><span style="width:${Math.min(100,production.completed/production.quantity*100)}%"></span></div>`:
        `<p>No production record yet.</p>
         <button class="btn small" onclick="createProduction('${o.id}')">Start Production</button>`
      }
    </div>
  `);
}

function setOrderStatus(id,status){

  showModal("Stock Movement",`
    <form onsubmit="saveStockMovement(event)">

        <div class="field">
          <label>Product</label>
          <select name="productId">
            ${db.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>Movement</label>
          <select name="type">

            <option value="ADJUST">Adjustment</option>
          </select>

        </div>
        <div class="field">

function saveStockMovement(e){
  e.preventDefault();
  const f=new FormData(e.target);
  const p=db.products.find(x=>x.id===f.get("productId"));
  const qty=Number(f.get("quantity"));

  if(!p)return;

  if(f.get("type")==="IN")p.stock+=qty;
  if(f.get("type")==="OUT")p.stock=Math.max(0,p.stock-qty);
  if(f.get("type")==="ADJUST")p.stock=qty;

  db.inventory.unshift({
    id:uid("INV"),
    productId:p.id,
    product:p.name,
    type:f.get("type"),
    quantity:qty,
    reference:f.get("reference"),
    date:today()
  });

  audit("INVENTORY_MOVEMENT",`${p.name} ${f.get("type")} ${qty}`);
  saveDB();
  closeModal();
  renderInventory();
  toast("Inventory updated");
}

function savePayment(e){
  e.preventDefault();
  const f=new FormData(e.target);
  const order=db.orders.find(o=>o.id===f.get("orderId"));
  const amount=Number(f.get("amount"));

  if(!order||amount<=0)return;

  const balance=Math.max(0,order.total-order.paid);
  const actual=Math.min(amount,balance);

  order.paid+=actual;

  db.payments.unshift({
    id:uid("PAY"),
    orderId:order.id,
    orderNumber:order.number,
    customerId:order.customerId,
    customer:order.customer,
    amount:actual,
    method:f.get("method"),
    reference:f.get("reference"),
    date:f.get("date"),
    note:""
  });

  audit("PAYMENT_RECEIVED",`${money(actual)} for ${order.number}`);
  saveDB();
  closeModal();

  if(currentPage==="payments")renderPayments();
  toast("Payment recorded");
}

function saveSettings(e){

  const f=new FormData(e.target);

  db.business.name=f.get("name");
  db.business.phone=f.get("phone");
  db.business.email=f.get("email");
  db.business.currency=f.get("currency")||"₦";
  db.business.address=f.get("address");
  db.settings.numberingPrefix=f.get("prefix")||"NSE";

  audit("SETTINGS_UPDATED","Business settings updated");
  saveDB();
  toast("Settings saved");
}

function backupDB(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`nura-sani-v20-backup-${today()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  audit("BACKUP_CREATED","Database backup downloaded");
}

function restoreDB(e){
  const file=e.target.files[0];
  if(!file)return;

  const reader=new FileReader();

  reader.onload=function(){
    try{
      const imported=JSON.parse(reader.result);

      if(!imported.version || !Array.isArray(imported.orders)){
        throw new Error("Invalid database format");
      }

      db=imported;
      saveDB();
      audit("DATABASE_RESTORED","Backup restored");
      toast("Database restored");
      navigate(currentPage);

    }catch(err){
      toast("Invalid backup file");
    }
  };

  reader.readAsText(file);
}

function resetDatabase(){
  if(!confirm("This will delete all local data. Continue?"))return;

  db=clone(defaultDB);
  saveDB();
  toast("Database reset");
  navigate("dashboard");
}
